<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>第五季 · 独立验收准备</title>
<style>body{font:16px system-ui;padding:28px;background:#eef0e6;color:#355950;line-height:1.8}button,select{font:inherit;padding:12px;margin:6px}button{border:1px solid #a2b8a6;background:#e0e7d2;border-radius:8px}</style>
<h1>第五季独立验收</h1><p>仅用于独立测试地址，会写当前地址的测试存档。不要在玩家使用的服务地址运行。</p><label>关卡 <select id="level"></select></label><div id="actions"></div>
<script type="module">
import {BOOK_LEVELS,getLevel} from '/src/levels.mjs';import {makeState} from '/src/core.mjs';import {saveLevel,rememberLevel} from '/src/progress.mjs';import {SEASON_FIVE} from '/src/season.mjs';
const select=document.querySelector('#level'),query=new URLSearchParams(location.search);
for(const level of BOOK_LEVELS){const option=document.createElement('option');option.value=level.id;option.textContent=level.number+' '+level.name;select.append(option);}if(query.has('level'))select.value=query.get('level');
function prepared(level,mode){const s=makeState(null,level);if(mode!=='fresh')s.surfaces.forEach(f=>f.finish());if(['operate','last','penultimate','done'].includes(mode))level.items.forEach(i=>s.placed.add(i.id));if(['last','penultimate','done'].includes(mode)){const tasks=level.operation.tasks||[];for(const task of mode==='done'?tasks:tasks.slice(0,mode==='penultimate'?-2:-1)){s.taskValues[task.id]=task.target??1;s.taskFields.find(f=>f.spec.id===task.id)?.finish();}const last=tasks.at(mode==='penultimate'?-2:-1);if(['last','penultimate'].includes(mode)&&last?.mode==='hold')s.taskValues[last.id]=(last.target??1)*(mode==='penultimate'?.995:.94);}if(mode==='done'){s.operationValue=level.operation.target??s.operationValue;s.brewTime=level.operation.duration;s.completed=true;}return s;}
for(const [id,label]of [['fresh','全新关卡'],['tidy','准备归位'],['operate','准备操作'],['last','准备最后一步'],['penultimate','验证长按转点击'],['done','查看完成场景'],['chapter-one','第一章最后一步'],['chapter-two','第二章最后一步'],['all-eight','前八关已完成']]){const button=document.createElement('button');button.textContent=label;button.onclick=()=>{if(!['127.0.0.1','localhost'].includes(location.hostname)||location.port!=='4204')throw Error('Only loopback QA');let level=getLevel(select.value),mode=id;if(id.startsWith('chapter-')){const count=id==='chapter-one'?2:5;for(const l of BOOK_LEVELS.slice(0,count))saveLevel(localStorage,prepared(l,'done'));level=BOOK_LEVELS[count];mode='last';}if(id==='all-eight'){for(const l of BOOK_LEVELS.slice(0,8))saveLevel(localStorage,prepared(l,'done'));level=getLevel(SEASON_FIVE.openingId);mode='fresh';}saveLevel(localStorage,prepared(level,mode));rememberLevel(localStorage,level);location.href='/?season=hillside-library&level='+level.id+'&diagnostics';};document.querySelector('#actions').append(button);}
</script></html>
