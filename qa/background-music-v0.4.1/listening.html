<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>背景音乐 · 试听验证</title>
<style>body{font:16px system-ui;line-height:1.7;padding:28px;background:#eeefe3;color:#3b5541}button,select{font:inherit;padding:12px;margin:6px}audio{display:block;width:min(620px,100%);margin:20px 0}pre{white-space:pre-wrap}a{color:inherit}</style>
<h1>两季背景音乐试听</h1><p>独立试听页面。不读取或修改游戏进度。使用与游戏相同的合成器渲染 35 秒片段。</p><select id="theme" aria-label="选择曲目"><option value="street-shop">街角旧店</option><option value="rain-garden">雨后花房</option></select><button id="render">生成试听片段</button><audio controls id="sample"></audio><a id="download" hidden>下载试听 WAV</a><pre id="result" role="status"></pre>
<script type="module">
import {renderMusicSample} from '/src/background-music.mjs';
function wav(buffer){const frames=buffer.length,channels=buffer.numberOfChannels,bytes=new ArrayBuffer(44+frames*channels*2),view=new DataView(bytes);const text=(n,s)=>{for(let i=0;i<s.length;i++)view.setUint8(n+i,s.charCodeAt(i))};text(0,'RIFF');view.setUint32(4,bytes.byteLength-8,true);text(8,'WAVE');text(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,channels,true);view.setUint32(24,buffer.sampleRate,true);view.setUint32(28,buffer.sampleRate*channels*2,true);view.setUint16(32,channels*2,true);view.setUint16(34,16,true);text(36,'data');view.setUint32(40,bytes.byteLength-44,true);for(let i=0;i<frames;i++)for(let channel=0;channel<channels;channel++){const sample=Math.max(-1,Math.min(1,buffer.getChannelData(channel)[i]));view.setInt16(44+(i*channels+channel)*2,Math.round(sample*(sample<0?32768:32767)),true);}return bytes;}
document.querySelector('#render').onclick=async()=>{
 const button=document.querySelector('#render'),result=document.querySelector('#result'),theme=document.querySelector('#theme').value;button.disabled=true;result.textContent='正在使用游戏合成器渲染…';
 try{const seconds=35,rate=24000,context=new OfflineAudioContext(2,seconds*rate,rate);const rendered=await renderMusicSample(context,theme,seconds);const buffer=rendered?.getChannelData?rendered:await context.startRendering();for(let channel=0;channel<buffer.numberOfChannels;channel++){const pcm=buffer.getChannelData(channel);for(let i=0;i<pcm.length;i++)pcm[i]*=.38;}let peak=0,square=0,silentBlocks=0;const data=buffer.getChannelData(0);for(let i=0;i<data.length;i++){peak=Math.max(peak,Math.abs(data[i]));square+=data[i]*data[i];}for(let i=rate;i<data.length;i+=rate){let energy=0;for(let j=i;j<Math.min(i+rate,data.length);j++)energy+=data[j]*data[j];if(energy/rate<1e-8)silentBlocks++;}const encoded=wav(buffer);const blob=new Blob([encoded],{type:'audio/wav'});const reader=new FileReader();reader.onload=()=>{document.querySelector('#sample').src=reader.result;const a=document.querySelector('#download');a.href=reader.result;a.download=theme+'-sample.wav';a.hidden=false;a.textContent='下载 '+theme+' 试听片段';};reader.readAsDataURL(blob);result.textContent=JSON.stringify({theme,seconds:buffer.duration,sampleRate:rate,masterGain:.38,channels:buffer.numberOfChannels,peak,rms:Math.sqrt(square/data.length),silentSecondsAfterIntro:silentBlocks},null,2);}catch(error){result.textContent=error.stack||String(error);}finally{button.disabled=false;}
};
</script></html>
